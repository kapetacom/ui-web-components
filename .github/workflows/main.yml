name: Main build
on:
  pull_request:
  push:
    branches: ['master']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # tags and releases are pushed with BOT_TOKEN
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Otherwise the job token overrides BOT_TOKEN for semantic-release's git push
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build
      - run: npm test -- --passWithNoTests
      # Probably move this to its own job when it makes sense
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v8.1.3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
